$kind: http-request
url: "{{echo_url}}/basic-auth"
method: GET
headers:
  User-Agent: PostmanRuntime/7.44.0
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing credentials return 401", () => {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
