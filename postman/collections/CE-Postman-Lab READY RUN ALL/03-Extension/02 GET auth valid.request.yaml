$kind: http-request
url: "{{echo_url}}/basic-auth"
method: GET
headers:
  User-Agent: PostmanRuntime/7.44.0
auth:
  type: basic
  credentials:
    username: postman
scripts:
  - type: afterResponse
    code: |-
      pm.test("Valid credentials return 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("User is authenticated", () => {
        pm.expect(pm.response.json().authenticated).to.eql(true);
      });
    language: text/javascript
order: 2000
