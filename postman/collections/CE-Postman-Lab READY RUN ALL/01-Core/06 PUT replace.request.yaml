$kind: http-request
url: "{{base_url}}/posts/1"
method: PUT
headers:
  Content-Type: application/json
  User-Agent: PostmanRuntime/7.44.0
body:
  type: json
  content: |-
    {
      "id": 1,
      "title": "Updated title",
      "body": "Updated body",
      "userId": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("PUT response matches complete body", () => {
        const sent = JSON.parse(pm.request.body.raw);
        pm.expect(pm.response.json()).to.deep.eql(sent);
      });
    language: text/javascript
order: 6000
