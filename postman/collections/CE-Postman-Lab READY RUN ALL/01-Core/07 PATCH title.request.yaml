$kind: http-request
url: "{{base_url}}/posts/1"
method: PATCH
headers:
  Content-Type: application/json
  User-Agent: PostmanRuntime/7.44.0
body:
  type: json
  content: |-
    {
      "title": "Patched title"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Title changed and remaining fields exist", () => {
        const data = pm.response.json();
        pm.expect(data.id).to.eql(1);
        pm.expect(data.title).to.eql("Patched title");
        pm.expect(data.body).to.be.a("string");
        pm.expect(data.userId).to.be.a("number");
      });
    language: text/javascript
order: 7000
