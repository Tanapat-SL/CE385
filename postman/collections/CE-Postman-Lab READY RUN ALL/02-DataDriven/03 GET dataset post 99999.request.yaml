$kind: http-request
description: GET /posts/99999, expected HTTP 404. Run all collection with 1 iteration.
url: "{{base_url}}/posts/{{post_id}}"
method: GET
headers:
  User-Agent: PostmanRuntime/7.44.0
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("post_id", 99999);
      pm.variables.set("expected_status", 404);
      console.log("Case 3: post_id=99999, expected_status=404");
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = Number(pm.variables.get("expected_status"));
      const id = Number(pm.variables.get("post_id"));

      pm.test("Status matches dataset", () => {
          pm.expect(pm.response.code).to.eql(expected);
      });

      if (expected === 200) {
          pm.test("Response id matches dataset", () => {
              pm.expect(pm.response.json().id).to.eql(id);
          });
      }
    language: text/javascript
order: 3000
