$kind: http-request
url: https://jsonplaceholder.typicode.com/posts/2
method: PUT
body:
  type: json
  content: |-
    {
    "id": 2,
    "title": "Hi",
    "body": "My assignment update",
    "userId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => {

      pm.response.to.have.status(200);

      });

      pm.test("Updated post matches my body", () => {

      const data = pm.response.json();

      pm.expect(data.id).to.eql(2);

      pm.expect(data.title).to.eql("Hi");

      pm.expect(data.body).to.eql("My assignment update");

      pm.expect(data.userId).to.eql(1);

      });
    language: text/javascript
